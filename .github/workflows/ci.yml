name: CI

on:
  push:
    paths-ignore:
      - signal2_state.json
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile
        run: python3 -m compileall -q signal2.py tests

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
