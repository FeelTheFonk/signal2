name: Signal2 - Veille IA

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes — unlimited minutes on public repos
  workflow_dispatch:          # manual trigger

permissions:
  contents: write             # autorise le commit de l'état (signal2_state.json)

concurrency:
  group: signal2-cycle
  cancel-in-progress: false   # sérialise les cycles : jamais de doublons

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SIGNAL2_WEBHOOK: ${{ secrets.SIGNAL2_WEBHOOK }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 1000 req/h pour l'API GitHub
    steps:
      - uses: actions/checkout@v5

      - name: Cycle de veille (poll + publication Discord)
        run: python3 signal2.py --poll

      - name: Persistance de l'etat (anti-doublon cross-runs)
        run: |
          git config user.name "Signal2 Bot"
          git config user.email "actions@github.com"
          git add signal2_state.json
          if git diff --cached --quiet; then
            echo "Aucun changement d'etat."
          else
            git commit -m "state: $(date -u +%FT%TZ)"
            git pull --rebase --autostash || true
            git push
          fi
